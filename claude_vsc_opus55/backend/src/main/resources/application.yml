spring:
  application:
    name: crud
  profiles:
    # 접속정보는 application-local.yml(.gitignore 대상)에 둔다.
    default: local
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
  jpa:
    # 스키마는 sql/스키마.sql 로 관리한다. JPA가 DDL을 바꾸지 않도록 validate.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  jwt:
    # Base64 인코딩된 256bit 이상 키. 운영에서는 반드시 환경변수 JWT_SECRET 으로 교체.
    secret: ${JWT_SECRET:Y3J1ZC10dXRvcmlhbC1kZXYtb25seS1zZWNyZXQta2V5LWNoYW5nZS1tZS0yMDI2}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.hibernate.SQL: debug
