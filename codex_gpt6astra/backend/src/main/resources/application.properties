spring.application.name=crud-tutorial
server.port=${SERVER_PORT:8086}
server.address=127.0.0.1
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//192.168.45.2:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:USERSTK6}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=5000
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=15000
spring.sql.init.mode=never
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
