server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: crud
  datasource:
    # 환경변수(DB_URL / DB_USERNAME / DB_PASSWORD)로 덮어쓸 수 있습니다.
    url: ${DB_URL:jdbc:oracle:thin:@//192.168.45.2:1521/XEPDB1}
    username: ${DB_USERNAME:USERSTK6}
    password: ${DB_PASSWORD:PwUserStk6}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
  jpa:
    # 테이블은 sql/스키마.sql 로 이미 생성되어 있으므로 JPA는 매핑 검증만 합니다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          fetch_size: 100

app:
  jwt:
    # HS256 서명키 (32바이트 이상). 운영에서는 반드시 환경변수 JWT_SECRET 으로 교체하세요.
    secret: ${JWT_SECRET:change-me-this-is-a-local-dev-only-secret-key-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}

logging:
  level:
    org.hibernate.SQL: debug
