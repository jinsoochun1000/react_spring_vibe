server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  profiles:
    # 개발 접속정보는 application-local.yml(gitignore) 또는 환경변수로 주입
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none        # 기존 TB_USER / TB_POST 테이블을 그대로 사용
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET}   # 32바이트 이상
    expiration-minutes: 120
