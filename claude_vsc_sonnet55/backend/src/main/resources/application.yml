server:
  port: ${SERVER_PORT:8090}
  servlet:
    encoding: { charset: UTF-8, force: true }

spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//192.168.45.2:1521/XEPDB1}
    username: ${DB_USERNAME:USERSTK7}
